
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <title>LingoFlow AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                500: '#6366f1',
                600: '#4f46e5',
                900: '#312e81',
              }
            },
            animation: {
              'blob': 'blob 7s infinite',
              'float': 'float 3s ease-in-out infinite',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      body {
        background-color: #f8fafc;
        min-height: 100vh;
        overscroll-behavior-y: none; 
        -webkit-tap-highlight-color: transparent;
        padding-top: var(--sat);
        padding-bottom: var(--sab);
        padding-left: var(--sal);
        padding-right: var(--sar);
      }
      
      /* Premium Mesh Gradient */
      .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                    radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                    radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        background-size: cover;
      }

      .light-mesh {
        background-color: #f1f5f9;
        background-image: 
          radial-gradient(at 40% 20%, hsla(250,100%,96%,1) 0px, transparent 50%),
          radial-gradient(at 80% 0%, hsla(189,100%,97%,1) 0px, transparent 50%),
          radial-gradient(at 0% 50%, hsla(341,100%,97%,1) 0px, transparent 50%),
          radial-gradient(at 80% 50%, hsla(260,100%,96%,1) 0px, transparent 50%),
          radial-gradient(at 0% 0%, hsla(343,100%,97%,1) 0px, transparent 50%);
      }
      
      /* Refined Glassmorphism */
      .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      }
      .dark .glass-panel {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      /* Primary Action Button Style */
      .btn-primary {
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
        color: white;
        box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        transition: all 0.2s ease-in-out;
      }
      .btn-primary:active {
        transform: scale(0.97);
        box-shadow: 0 2px 10px 0 rgba(99, 102, 241, 0.3);
      }

      /* Card Hover Effect */
      .card-hover {
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }
      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(0,0,0,0.06);
      }

      /* 3D Card Flip Utilities */
      .perspective-1000 { perspective: 1000px; }
      .transform-style-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }
      .rotate-y-180 { transform: rotateY(180deg); }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Mask for fading horizontal lists */
      .mask-gradient-right {
        mask-image: linear-gradient(to right, black 85%, transparent 100%);
        -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
      }

      /* Audio Visualizer Animation */
      .bar {
        animation: sound 0.8s linear infinite;
        background: currentColor;
        height: 100%;
        width: 4px;
        border-radius: 4px;
      }
      @keyframes sound {
        0% { height: 20%; }
        50% { height: 100%; }
        100% { height: 20%; }
      }
      
      /* Modal animations */
      @keyframes slide-in-from-bottom {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      
      .animate-in {
        animation: slide-in-from-bottom 0.3s ease-out;
      }

      /* Typography System - Standard Font Sizes */
      /* Body text - default for all content */
      .text-body {
        font-size: 1rem; /* 16px */
        line-height: 1.5;
      }

      /* Headings */
      .text-h1 {
        font-size: 1.875rem; /* 30px */
        line-height: 1.2;
        font-weight: 800;
      }

      .text-h2 {
        font-size: 1.5rem; /* 24px */
        line-height: 1.3;
        font-weight: 700;
      }

      .text-h3 {
        font-size: 1.25rem; /* 20px */
        line-height: 1.4;
        font-weight: 700;
      }

      .text-h4 {
        font-size: 1.125rem; /* 18px */
        line-height: 1.4;
        font-weight: 600;
      }

      /* Labels and small text */
      .text-label {
        font-size: 0.75rem; /* 12px */
        line-height: 1.4;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .text-caption {
        font-size: 0.75rem; /* 12px */
        line-height: 1.5;
        font-weight: 400;
      }

      .text-small {
        font-size: 0.875rem; /* 14px */
        line-height: 1.5;
        font-weight: 400;
      }

      /* Buttons */
      .text-button {
        font-size: 0.875rem; /* 14px */
        line-height: 1.4;
        font-weight: 600;
      }

      /* Large display text */
      .text-display {
        font-size: 2.25rem; /* 36px */
        line-height: 1.1;
        font-weight: 800;
      }

      /* Ensure base font size for body */
      body {
        font-size: 1rem; /* 16px base */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@4.0.379/build/pdf.mjs",
    "pdfjs-dist/": "https://esm.sh/pdfjs-dist@4.0.379/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="antialiased text-slate-800 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
